services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL= ${DATABASE_URL}
    depends_on:
      - db
    networks:
      - safecity-network

  db:
    image: postgis/postgis:latest  # Use the official PostGIS image
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data # For persistent data storage
    networks:
      - safecity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 5
    ports:
      - "5431:5432"  # Expose PostgreSQL port

networks:
  safecity-network:
    driver: bridge
volumes:
  db_data:
